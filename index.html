<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國立科技高中─校園社團介紹網</title>

  <style>
    #main{
      width: 1024px;
      height: 768px;
      margin: auto;
    }
    #top{
      width: 1000px;
      height: 65px;
      margin: auto;
    }
    #left{
      width: 215px;
      /* 運算符號左右兩側要半形空白 */
      height: calc(768px - 65px - 20px);
      float: left;
      margin-left: 12px;
    }
    #menu{
      width: 215px;
      height: calc(768px - 65px - 20px - 25px);
      font-family: '標楷體';
      font-weight: 500;
      div{
        font-size: 24px;
        text-decoration: underline;
        text-align: center;
        color: #FF00FF;
      }
      table{
        color: #000000;
        font-size: 16px;
        width: 100%;
        text-align: center;
      }
      td{
        /* 也可以 35px，根據 menu1.png 的高度，設定 40px 較好看 */
        height: 40px;
        background: url(./images/menu1.png) no-repeat center;
        &:hover{
          background: url(./images/menu2.png) no-repeat center;
        }
      }
    }
    #update{
      width: 215px;
      height: 25px;
      font-family: '標楷體';
      font-size: 16px;
      color: #000000;
      text-align: center;
      line-height: 25px;
    }
    #right{
      width: 770px;
      height: calc(768px - 65px - 20px);
      margin-right: 12px;
      float: right;
      /* font-size: 0; */
      marquee{
        width: 100%;
        height: 29px;
        /* font-size: 1rem; */
        vertical-align: middle;
        font-family: '標楷體';
        font-size: 24px;
        color: #0000FF;
      }
      iframe{
        width: 100%;
        height: calc(768px - 65px - 20px - 29px);
      }
    }
    #footer{
      display: flow-root;
      width: 1000px;
      height: 20px;
      margin: auto;
      font-family: '標楷體';
      font-size: 16px;
      color: #000000;
      text-align: center;
      line-height: 20px;
    }
  </style>
</head>
<body>
  <div id="main">
    <div id="top">
      <!-- alt 替代文字，資源連結有錯時會顯示的文字 -->
       <!-- title 圖片標題文字，滑鼠移上去會顯示的文字 -->
      <a href="./index.html"><img src="./images/logo.png" alt="國立科技高中校園社團介紹網" title="國立科技高中校園社團介紹網"></a>
    </div>
    <div id="left">
      <div id="menu">
        <div>社團介紹</div>
        <!-- table>tr*6>td -->
        <table>
          <tr>
            <td>
              <a href="./guitar_history.html" target="iframe">吉他社</a>
            </td>
          </tr>
          <tr>
            <td>熱舞社</td>
          </tr>
          <tr>
            <td>棒球社</td>
          </tr>
          <tr>
            <td>羽球社</td>
          </tr>
          <tr>
            <td>足球社</td>
          </tr>
          <tr>
            <td>童軍社</td>
          </tr>
        </table>
      </div>
      <div id="update">最近更新日期：2026/11/27</div>
    </div>
    <div id="right">
      <marquee>歡迎光臨校園社團介紹網，參觀後請支持社團活動並熱烈參與</marquee>
      <iframe src="./main.html" frameborder="0" name="iframe"></iframe>
    </div>
    <div id="footer">網頁設計及維護：03毛毛毛</div>
  </div>
</body>
</html>
